name: Deploy to Web Hosting (FTP)

on:
  push:
    branches:
      - main
      - master # Sesuaikan dengan branch utama Anda

jobs:
  web-deploy:
    name: Deploy to Hosting
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      
    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # Sesuaikan versi PHP
        
    - name: 📦 Install Dependencies (Composer)
      run: composer install --no-dev --optimize-autoloader

    - name: ⚙️ Prepare Files for Production
      run: |
        # Mematikan display_errors di bootstrap.php untuk production
        if [ -f "bootstrap.php" ]; then
          sed -i "s/ini_set('display_errors', 1);/ini_set('display_errors', 0);/g" bootstrap.php
          sed -i "s/ini_set('display_errors', '1');/ini_set('display_errors', '0');/g" bootstrap.php
        fi
        
        # Menyalin htaccess default untuk hosting
        # Anda bisa mengubah .htaccess-subfolder menjadi .htaccess-root atau .htaccess-cpanel-minimal sesuai path aplikasi di server
        if [ -f "htaccess/.htaccess-subfolder" ]; then
          cp htaccess/.htaccess-subfolder .htaccess
        fi

    - name: 🚀 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /public_html/ # UBAH INI sesuai dengan path direktori tujuan di hosting Anda (misal: /public_html/jurnal/ atau /htdocs/)
        exclude: |
          **/.git*
          **/.git*/**
          .github/**
          scratch/**
          deploy_prod/**
          home5/**
          backup/**
          deploy/**
          test_*.php
          debug_*.php
          check_*.php
          tmp_*.php
          config.local.php
          koneksi_local.php
          config.hosting.php
          package.json
          package-lock.json
          gulpfile.js
          composer.json
          composer.lock
          build-hosting.ps1
          build-hosting-simanis.ps1
          *.md
          *.log
          *.bak
          *.zip
